services:
  ollama:
    image: ollama/ollama:latest
    container_name: emobridge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: emobridge-ai-service
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: hf.co/nglong14/qwen2.5-3b-distressai-gguf:Q4_K_M
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
