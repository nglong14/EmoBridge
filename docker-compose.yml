services:
  # ── Database ──
  postgres:
    image: postgres:16-alpine
    container_name: emobridge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emobridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emobridge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── AI Infrastructure ──
  ollama:
    image: ollama/ollama:latest
    container_name: emobridge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: emobridge-ai-service
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: hf.co/nglong14/qwen2.5-3b-distressai-gguf:Q4_K_M
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

  # ── Backend Gateway ──
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: emobridge-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emobridge
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emobridge-frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
